<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Challenges</title>
</head>
<body>
    <!-- Create an HTML document with a heading that says "Welcome to the course" -->
    <h1>Welcome to the course</h1>
 
    <br/>

    <!-- Create an HTML paragraph that contains a link to "www.example.com" with the text "Click here to visit." -->
    <p>Click <a href="https://www.example.com">here</a> to visit.</p>

    <br/>

    <!-- Create a text element that shows additional information in a tooltip when hovered over. -->
    <p title="This is a tooltip text">This is a tooltip</p>

    <br/>

    <!-- Create a button that displays the text "Submit" -->
    <button type="submit">Submit</button>

    <br/>

    <!-- Create an unordered list of three favorite fruits. -->
    <ul>
        <li>Apple</li>
        <li>Banana</li>
        <li>Cherry</li>
    </ul>

    <br/>

    <!-- Create a table with two rows and two columns. The first row should contain the headings. The second and third row should contain the data repectively. -->
    <table>
        <thead>
      <tr>
          <th>Name</th>
          <th>Age</th>
      </tr>
      </thead>
      <tbody>
          <tr>
              <td>John</td>
              <td>30</td>
          </tr>
          <tr>
              <td>Harry</td>
              <td>26</td>
          </tr>
      </tbody>    
    </table>


    <br/>

    <!-- Create a simple form with two input fields: one for "Username" and one for "Password." -->
    <form action="">
        <label for="username">
            Username
            <input type="text" id="username"></label>
        <label for="password">
            Password
            <input type="password" id="password"></label>
    </form>

    <br/>


    <!-- Create a form with a dropdown menu for selecting a country. Include three options: "India", "Canada", and "UK. -->
    <form action="">
        <select name="country" id="country">
            <option value="India">India</option>
            <option value="Canada">Canada</option>
            <option value="UK">UK</option>
        </select>
    </form>

    <br/>

    <!-- Display an image with a URL of "https://placehold.co/150" and add the alt text "Placeholder Image" -->
    <img src="https://placehold.co/150" alt="Placeholder Image" />


    <br/>

    <!-- Create a hyperlink to "https://www.wikipedia.org" that opens in a new browser tab when clicked. -->
    <a href="https://www.wikipedia.org" target="_blank">hyperlink</a>


    <br/>

    <!-- Create a simple progress bar with a label that shows 70% completion. -->
    <progress id="progress" max="100" value="70">70%</progress>

 </body>
</html>
