<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <title>Document</title>
</head>
<body>
    <!-- Style A Button with Tailwind CSS -->
    <button class="bg-blue-500 px-3 py-2 rounded-md hover:bg-blue-700">Button</button>
 
    <br/>

    <!-- Center a Div Using Flexbox -->
    <div id="parent" class="flex items-center justify-center h-screen">
        <div id="child" class="text-center">
            <h1 class="text-2xl">Heading</h1>
            <p>This div is centered</p>
        </div>
    </div>

    <br/>

    <!-- Create a Basic Grid Layout -->
    <div class="grid grid-cols-2 grid-rows-2 gap-4 p-3">
        <div class="bg-blue-500 p-5 rounded-md text-center">1</div>
        <div class="bg-green-500 p-5 rounded-md text-center">2</div>
        <div class="bg-purple-500 p-5 rounded-md text-center">3</div>
        <div class="bg-pink-500 p-5 rounded-md text-center">4</div>
    </div>

    <br/>

    <!-- Apply Box Shadow to a Card Using Tailwind CSS -->
    <div class="shadow-lg p-6 bg-white rounded-lg">
      <h2>Heading</h2>
      <p>Some paragraph</p>
    </div> 

    <br/>

    <!-- Create a Donut Shape Using Tailwind CSS -->
    <div class="w-40 h-40 rounded-full bg-red-500 flex justify-center items-center">
        <div class="w-16 h-16 rounded-full bg-white"></div>
    </div>

    <br/>

    <!-- Add Blur Effect to an Image -->
    <img src="https://hips.hearstapps.com/hmg-prod/images/gettyimages-1097661412.jpg?crop=0.665xw:1.00xh;0.173xw,0&resize=1400:*" alt="bts" class="p-4 border-2 border-black filter blur-md" />

    <br/>

    <!-- Create a Gradient Colored Button Using Tailwind CSS -->
    <button class="bg-gradient-to-r from-blue-500 to-pink-500 hover:from-pink-500 hover:to-blue-500 py-2 px-4 text-white shadow-md">Button</button>

    <br/> <br/> <br/>

    <!-- Create a Rotating Square Box Using Tailwind CSS -->
    <div class="w-32 h-32 bg-blue-500 border-4 border-gray-800 animate-spin"></div>
     
 </body>
</html>
