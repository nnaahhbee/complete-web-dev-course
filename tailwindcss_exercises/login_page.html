<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page using Tailwindcss</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-800 flex items-center justify-center min-h-screen">
    <div class="bg-gray-600 p-9 rounded-lg shadow-lg w-full max-w-sm">
        <h2 class="">Login</h2>
        <form>
            <div >
                <label>Email</label>
                <input type="email">
            </div>
            
            <div>
                <label>Password</label>
                <input type="password">
            </div>
        </form>
    </div>
</body>
</html>
