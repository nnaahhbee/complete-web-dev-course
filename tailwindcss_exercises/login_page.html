<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page using Tailwindcss</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-900 flex items-center justify-center min-h-screen">
    <div class="bg-gray-700 p-9 rounded-lg shadow-2xl w-full max-w-sm">
        <h2 class="text-center text-3xl text-white font-medium mb-6">Login</h2>
        <form>
            <div class="mb-4">
                <label class="block text-gray-300 font-medium text-sm mb-2">Email</label>
                <input class="w-full px-3 py-2 bg-gray-600 border-gray-800 text-white rounded-md focus:outline-none focus:ring-1 focus:ring-blue-700" type="email" placeholder="you@email.com">
            </div>
            
            <div class="mb-6">
                <label class="block text-gray-300 font-medium
                 text-sm mb-2">Password</label>
                <input class="w-full px-3 py-2 bg-gray-600 border-gray-700 text-white rounded-md focus:outline-none focus:ring-1 focus:ring-blue-700" type="password" placeholder="*******">
            </div>

            <div>
                <button class="w-full py-2 text-white bg-blue-600 rounded-md hover:bg-blue-800 shadow-2xl" type="submit">Login</button>
            </div>
        </form>
    </div>
</body>
</html>
